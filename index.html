<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Tax & GST Tracker (Mobile)</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 pb-12">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [transactions, setTransactions] = React.useState(() => {
                const saved = localStorage.getItem('tax_tracker_txs_mob');
                return saved ? JSON.parse(saved) : [];
            });
            
            const [mode, setMode] = React.useState('both'); // 'both' or 'tax_only'
            const [desc, setDesc] = React.useState('');
            const [amount, setAmount] = React.useState('');
            const [type, setType] = React.useState('expense'); 
            const [claimType, setClaimType] = React.useState('both');

            React.useEffect(() => {
                localStorage.setItem('tax_tracker_txs_mob', JSON.stringify(transactions));
            }, [transactions]);

            // Smart Auto-Detection
            const handleDescChange = (val) => {
                setDesc(val);
                const lower = val.toLowerCase();
                if (lower.includes('mcdonald') || lower.includes('kfc') || lower.includes('coles') || lower.includes('woolworths') || lower.includes('netflix')) {
                    setClaimType('personal');
                } else if (lower.includes('fuel') || lower.includes('bp') || lower.includes('shell') || lower.includes('ampol')) {
                    setClaimType('both');
                } else if (lower.includes('toll') || lower.includes('linkt') || lower.includes('registration')) {
                    setClaimType('tax_only');
                } else if (lower.includes('salary') || lower.includes('income') || lower.includes('uber') || lower.includes('amazon')) {
                    setType('income');
                    setClaimType('income');
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!desc || !amount) return;

                const newTx = {
                    id: Date.now(),
                    desc,
                    amount: parseFloat(amount),
                    type,
                    claimType: type === 'income' ? 'income' : claimType,
                    date: new Date().toISOString().split('T')[0]
                };

                setTransactions([newTx, ...transactions]);
                setDesc('');
                setAmount('');
                setClaimType('both');
            };

            const deleteTx = (id) => {
                setTransactions(transactions.filter(t => t.id !== id));
            };

            // CSV File Upload Handler (Bank Statement simulation)
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.split('\n');
                    const newTxs = [];

                    lines.forEach((line, index) => {
                        if (index === 0 || !line.trim()) return; // Skip header
                        const cols = line.split(',');
                        if (cols.length >= 2) {
                            const description = cols[0].replace(/['"]+/g, '').trim();
                            const amtVal = parseFloat(cols[1].replace(/['"]+/g, '').trim());
                            
                            if (!isNaN(amtVal)) {
                                const isInc = amtVal > 0 && (description.toLowerCase().includes('salary') || description.toLowerCase().includes('income') || description.toLowerCase().includes('deposit'));
                                newTxs.push({
                                    id: Date.now() + index,
                                    desc: description || 'Bank Transaction',
                                    amount: Math.abs(amtVal),
                                    type: isInc ? 'income' : 'expense',
                                    claimType: isInc ? 'income' : 'both',
                                    date: new Date().toISOString().split('T')[0]
                                });
                            }
                        }
                    });

                    if (newTxs.length > 0) {
                        setTransactions(prev => [...newTxs, ...prev]);
                        alert(`Successfully imported ${newTxs.length} transactions from bank file!`);
                    } else {
                        alert('Could not parse transactions. Please ensure CSV format is: Description, Amount');
                    }
                };
                reader.readAsText(file);
            };

            // Calculations
            const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense');

            const gstEligibleExpenses = expenses.filter(t => t.claimType === 'both').reduce((acc, t) => acc + t.amount, 0);
            const estimatedGST = gstEligibleExpenses / 11; 

            const deductibleExpenses = expenses.reduce((acc, t) => {
                if (t.claimType === 'both') return acc + (t.amount - (t.amount / 11));
                if (t.claimType === 'tax_only') return acc + t.amount;
                return acc;
            }, 0);

            const taxableIncome = Math.max(0, totalIncome - deductibleExpenses);

            // Tax Brackets 2025-26
            let estimatedTax = 0;
            if (taxableIncome > 18200 && taxableIncome <= 45000) {
                estimatedTax = (taxableIncome - 18200) * 0.16;
            } else if (taxableIncome > 45000 && taxableIncome <= 135000) {
                estimatedTax = 4288 + (taxableIncome - 45000) * 0.30;
            } else if (taxableIncome > 135000 && taxableIncome <= 190000) {
                estimatedTax = 31288 + (taxableIncome - 135000) * 0.37;
            } else if (taxableIncome > 190000) {
                estimatedTax = 51638 + (taxableIncome - 190000) * 0.45;
            }
            const medicareLevy = taxableIncome * 0.02;
            const totalTaxLiability = estimatedTax + medicareLevy;

            // BAS Due Date simulation (e.g. 28th of next month)
            const today = new Date();
            const currentMonth = today.getMonth(); // 0-11
            // Let's set next BAS due date to 28th of coming month
            const dueDaysLeft = 28 - today.getDate() + (today.getDate() > 28 ? 30 : 0);

            return (
                <div className="max-w-md mx-auto p-3 sm:p-4">
                    {/* Header */}
                    <header className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-4">
                        <div className="flex justify-between items-center mb-2">
                            <h1 className="text-base font-bold text-blue-600">Tax & GST Mobile Tracker</h1>
                            <select 
                                value={mode} 
                                onChange={(e) => setMode(e.target.value)}
                                className="text-xs border rounded-lg p-1.5 bg-gray-50 font-medium"
                            >
                                <option value="both">ABN (GST+Tax)</option>
                                <option value="tax_only">TFN (Tax Only)</option>
                            </select>
                        </div>
                        {/* BAS Alert Banner */}
                        {mode === 'both' && (
                            <div className="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-xs text-amber-800 flex justify-between items-center">
                                <span>📅 Next BAS Due in <strong>{dueDaysLeft} Days</strong> (28th)</span>
                                <span className="font-bold text-blue-600">GST Due: ${estimatedGST.toFixed(2)}</span>
                            </div>
                        )}
                    </header>

                    {/* Summary Cards */}
                    <div className="grid grid-cols-2 gap-3 mb-4">
                        <div className="bg-white p-3 rounded-2xl shadow-sm border border-gray-200">
                            <p className="text-[10px] text-gray-500 font-bold uppercase">Total Income</p>
                            <p className="text-lg font-extrabold text-green-600">${totalIncome.toFixed(2)}</p>
                        </div>
                        <div className="bg-white p-3 rounded-2xl shadow-sm border border-gray-200">
                            <p className="text-[10px] text-gray-500 font-bold uppercase">Tax Deductions</p>
                            <p className="text-lg font-extrabold text-orange-600">${deductibleExpenses.toFixed(2)}</p>
                        </div>
                    </div>

                    {/* Tax Estimate Box */}
                    <div className="bg-blue-600 text-white p-4 rounded-2xl mb-4 shadow-sm">
                        <p className="text-xs opacity-80">Estimated Annual Tax + Medicare (2025-26)</p>
                        <p className="text-2xl font-black">${totalTaxLiability.toFixed(2)}</p>
                        <p className="text-[10px] opacity-70 mt-1">Taxable Income: ${taxableIncome.toFixed(2)}</p>
                    </div>

                    {/* Bank Statement Upload Box */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-4">
                        <label className="block text-xs font-bold text-gray-700 mb-2">📥 Upload Bank Statement (CSV)</label>
                        <input 
                            type="file" 
                            accept=".csv" 
                            onChange={handleFileUpload}
                            className="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                        />
                        <p className="text-[10px] text-gray-400 mt-1">Format: Description, Amount (e.g., BP Fuel, -50.00)</p>
                    </div>

                    {/* Quick Manual Add Form */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-4">
                        <h2 className="text-xs font-bold mb-3 text-gray-700 uppercase">Add Transaction Manually</h2>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div>
                                <input 
                                    type="text" 
                                    value={desc} 
                                    onChange={(e) => handleDescChange(e.target.value)} 
                                    placeholder="Description (e.g. BP Fuel, McDonald)" 
                                    className="w-full border rounded-xl p-2.5 text-xs bg-gray-50"
                                    required
                                />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <input 
                                    type="number" 
                                    step="0.01" 
                                    value={amount} 
                                    onChange={(e) => setAmount(e.target.value)} 
                                    placeholder="Amount ($)" 
                                    className="w-full border rounded-xl p-2.5 text-xs bg-gray-50"
                                    required
                                />
                                <select 
                                    value={type} 
                                    onChange={(e) => setType(e.target.value)} 
                                    className="w-full border rounded-xl p-2.5 text-xs bg-gray-50 font-medium"
                                >
                                    <option value="expense">Expense (-)</option>
                                    <option value="income">Income (+)</option>
                                </select>
                            </div>
                            {type === 'expense' && mode === 'both' && (
                                <div>
                                    <select 
                                        value={claimType} 
                                        onChange={(e) => setClaimType(e.target.value)} 
                                        className="w-full border rounded-xl p-2.5 text-xs bg-blue-50 font-medium text-blue-900"
                                    >
                                        <option value="both">Both (GST + Tax)</option>
                                        <option value="tax_only">Tax Only (No GST)</option>
                                        <option value="personal">Personal (Ignored)</option>
                                    </select>
                                </div>
                            )}
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl text-xs shadow-sm">
                                Save Transaction
                            </button>
                        </form>
                    </div>

                    {/* Transaction History */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                        <h2 className="text-xs font-bold mb-3 text-gray-700 uppercase">History ({transactions.length})</h2>
                        {transactions.length === 0 ? (
                            <p className="text-xs text-gray-400 text-center py-6">No records found. Upload CSV or add above.</p>
                        ) : (
                            <div className="space-y-2 max-h-96 overflow-y-auto">
                                {transactions.map((t) => (
                                    <div key={t.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100 text-xs">
                                        <div className="pr-2">
                                            <p className="font-bold text-gray-800">{t.desc}</p>
                                            <p className="text-[10px] text-gray-400">{t.date} • <span className="text-blue-600 font-semibold uppercase">{t.claimType}</span></p>
                                        </div>
                                        <div className="text-right flex items-center gap-3">
                                            <span className={`font-black ${t.type === 'income' ? 'text-green-600' : 'text-red-600'}`}>
                                                {t.type === 'income' ? '+' : '-'}${t.amount.toFixed(2)}
                                            </span>
                                            <button onClick={() => deleteTx(t.id)} className="text-gray-300 hover:text-red-600 font-bold text-sm">×</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
