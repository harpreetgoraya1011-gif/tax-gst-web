<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Tax & GST Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [transactions, setTransactions] = React.useState(() => {
                const saved = localStorage.getItem('tax_tracker_txs');
                return saved ? JSON.parse(saved) : [];
            });
            
            const [mode, setMode] = React.useState('both'); // 'both' (GST+Tax) or 'tax_only' (TFN only)
            const [desc, setDesc] = React.useState('');
            const [amount, setAmount] = React.useState('');
            const [type, setType] = React.useState('expense'); // 'income' or 'expense'
            const [claimType, setClaimType] = React.useState('both'); // 'both', 'tax_only', 'personal'

            React.useEffect(() => {
                localStorage.setItem('tax_tracker_txs', JSON.stringify(transactions));
            }, [transactions]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!desc || !amount) return;

                const newTx = {
                    id: Date.now(),
                    desc,
                    amount: parseFloat(amount),
                    type,
                    claimType: type === 'income' ? 'income' : claimType,
                    date: new Date().toLocaleDateString()
                };

                setTransactions([newTx, ...transactions]);
                setDesc('');
                setAmount('');
            };

            const deleteTx = (id) => {
                setTransactions(transactions.filter(t => t.id !== id));
            };

            // Calculations
            const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            
            const expenses = transactions.filter(t => t.type === 'expense');
            const totalExpenses = expenses.reduce((acc, t) => acc + t.amount, 0);

            // GST Calculation (Only for 'both' claim type)
            const gstEligibleExpenses = expenses.filter(t => t.claimType === 'both').reduce((acc, t) => acc + t.amount, 0);
            const estimatedGST = gstEligibleExpenses / 11; // 1/11th rule for GST credit

            // Tax Deductions Calculation
            const deductibleExpenses = expenses.reduce((acc, t) => {
                if (t.claimType === 'both') return acc + (t.amount - (t.amount / 11));
                if (t.claimType === 'tax_only') return acc + t.amount;
                return acc;
            }, 0);

            const taxableIncome = Math.max(0, totalIncome - deductibleExpenses);

            // Australian 2025-26 Tax Brackets estimation
            let estimatedTax = 0;
            if (taxableIncome > 18200 && taxableIncome <= 45000) {
                estimatedTax = (taxableIncome - 18200) * 0.16;
            } else if (taxableIncome > 45000 && taxableIncome <= 135000) {
                estimatedTax = 4288 + (taxableIncome - 45000) * 0.30;
            } else if (taxableIncome > 135000 && taxableIncome <= 190000) {
                estimatedTax = 31288 + (taxableIncome - 135000) * 0.37;
            } else if (taxableIncome > 190000) {
                estimatedTax = 51638 + (taxableIncome - 190000) * 0.45;
            }
            const medicareLevy = taxableIncome * 0.02;
            const totalTaxLiability = estimatedTax + medicareLevy;

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <header className="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <div>
                            <h1 className="text-xl font-bold text-blue-600">Personal Tax & GST Tracker</h1>
                            <p className="text-xs text-gray-500">For Sole Traders & Individuals (Australia)</p>
                        </div>
                        <div>
                            <select 
                                value={mode} 
                                onChange={(e) => setMode(e.target.value)}
                                className="text-sm border rounded-lg p-2 bg-gray-50 font-medium"
                            >
                                <option value="both">Mode: GST + Tax (ABN)</option>
                                <option value="tax_only">Mode: Tax Only (TFN)</option>
                            </select>
                        </div>
                    </header>

                    {/* Summary Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <p className="text-xs text-gray-500 font-semibold uppercase">Total Income</p>
                            <p className="text-2xl font-bold text-green-600">${totalIncome.toFixed(2)}</p>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <p className="text-xs text-gray-500 font-semibold uppercase">Tax Deductions</p>
                            <p className="text-2xl font-bold text-orange-600">${deductibleExpenses.toFixed(2)}</p>
                        </div>
                        {mode === 'both' && (
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p className="text-xs text-gray-500 font-semibold uppercase">Est. Quarterly GST Credit</p>
                                <p className="text-2xl font-bold text-blue-600">${estimatedGST.toFixed(2)}</p>
                            </div>
                        )}
                    </div>

                    {/* Tax Estimate Box */}
                    <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl mb-6 flex justify-between items-center">
                        <div>
                            <h2 className="font-bold text-blue-900 text-sm">Estimated Annual Tax & Levy (2025-26)</h2>
                            <p className="text-xs text-blue-700">Taxable Income: ${taxableIncome.toFixed(2)}</p>
                        </div>
                        <div className="text-right">
                            <p className="text-xl font-extrabold text-blue-900">${totalTaxLiability.toFixed(2)}</p>
                        </div>
                    </div>

                    {/* Input Form */}
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">
                        <h2 className="text-sm font-bold mb-4 text-gray-700">Add New Transaction</h2>
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-medium text-gray-600 mb-1">Description / Receipt Note</label>
                                <input 
                                    type="text" 
                                    value={desc} 
                                    onChange={(e) => setDesc(e.target.value)} 
                                    placeholder="e.g. Fuel from BP Pump" 
                                    className="w-full border rounded-lg p-2 text-sm"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-600 mb-1">Amount ($)</label>
                                <input 
                                    type="number" 
                                    step="0.01" 
                                    value={amount} 
                                    onChange={(e) => setAmount(e.target.value)} 
                                    placeholder="0.00" 
                                    className="w-full border rounded-lg p-2 text-sm"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-600 mb-1">Type</label>
                                <select 
                                    value={type} 
                                    onChange={(e) => setType(e.target.value)} 
                                    className="w-full border rounded-lg p-2 text-sm"
                                >
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                            </div>
                            {type === 'expense' && mode === 'both' && (
                                <div>
                                    <label className="block text-xs font-medium text-gray-600 mb-1">Claim Classification</label>
                                    <select 
                                        value={claimType} 
                                        onChange={(e) => setClaimType(e.target.value)} 
                                        className="w-full border rounded-lg p-2 text-sm"
                                    >
                                        <option value="both">Both (GST Credit + Tax Deduction)</option>
                                        <option value="tax_only">Tax Deduction Only (No GST)</option>
                                        <option value="personal">Personal / Non-Claimable</option>
                                    </select>
                                </div>
                            )}
                            <div className="sm:col-span-2">
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded-lg text-sm transition">
                                    Add Record
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* Transaction History */}
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                        <h2 className="text-sm font-bold mb-4 text-gray-700">Transaction History</h2>
                        {transactions.length === 0 ? (
                            <p className="text-sm text-gray-400 text-center py-4">No transactions added yet.</p>
                        ) : (
                            <div className="space-y-2">
                                {transactions.map((t) => (
                                    <div key={t.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100 text-sm">
                                        <div>
                                            <p className="font-semibold text-gray-800">{t.desc}</p>
                                            <p className="text-xs text-gray-400">{t.date} • <span className="uppercase">{t.type}</span> ({t.claimType})</p>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <span className={`font-bold ${t.type === 'income' ? 'text-green-600' : 'text-red-600'}`}>
                                                {t.type === 'income' ? '+' : '-'}${t.amount.toFixed(2)}
                                            </span>
                                            <button onClick={() => deleteTx(t.id)} className="text-gray-400 hover:text-red-600 text-xs">Delete</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
